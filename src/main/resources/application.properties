server.port=8081

# Credenciales MariaDB local (mismas que TavernMaster local)
spring.datasource.url=jdbc:mysql://localhost:3306/GuildMaster?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=miPassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=false

spring.jackson.property-naming-strategy=SNAKE_CASE

# JWT: same token until idle 30m or absolute 16h from login (server tracks last access by jti)
guildmaster.jwt.secret=GuildMasterJwtSecretKey_ChangeInProd_MustBeLongEnough_256bits_Minimum_OK_2026
guildmaster.jwt.max-hours=16
guildmaster.jwt.idle-minutes=30
