server.port=${PORT:8081}

# Local defaults (override with env in prod). Same DB as phpMyAdmin / Docker MariaDB.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/GuildMaster?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:miPassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=false

spring.jackson.property-naming-strategy=SNAKE_CASE

# JWT: same token until idle 30m or absolute 16h from login (server tracks last access by jti)
# Default secret is LOCAL ONLY — set JWT_SECRET in production.
guildmaster.jwt.secret=${JWT_SECRET:GuildMasterJwtSecretKey_ChangeInProd_MustBeLongEnough_256bits_Minimum_OK_2026}
guildmaster.jwt.max-hours=${JWT_MAX_HOURS:16}
guildmaster.jwt.idle-minutes=${JWT_IDLE_MINUTES:30}
guildmaster.web.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8082,http://localhost:19006}
guildmaster.auth.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
guildmaster.auth.login.window-seconds=${LOGIN_WINDOW_SECONDS:60}
guildmaster.auth.login.block-seconds=${LOGIN_BLOCK_SECONDS:300}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
