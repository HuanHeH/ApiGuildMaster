<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GuildMaster - Login</title>
    <link rel="stylesheet" href="/styles.css?v=20260723c" />
</head>
<body class="login-page">
<div class="login-card">
    <h1>GuildMaster</h1>
    <p class="subtitle">Sign in (JWT · 16h max · 30 min idle)</p>
    <form id="formLogin">
        <div class="form-group">
            <label for="loginMail">Mail</label>
            <input type="email" id="loginMail" autocomplete="username" required>
        </div>
        <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" autocomplete="current-password" required>
        </div>
        <button type="submit">Login</button>
    </form>
    <div id="loginError" class="auth-error"></div>
</div>
<script>
    const AUTH_KEY = 'gm_auth';
    if (sessionStorage.getItem(AUTH_KEY)) {
        const s = JSON.parse(sessionStorage.getItem(AUTH_KEY));
        window.location.href = s.role === 'Admin' ? '/index.html' : '/index.html';
    }

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
        e.preventDefault();
        const box = document.getElementById('loginError');
        box.style.display = 'none';

        const mail = document.getElementById('loginMail').value.trim();
        const password = document.getElementById('loginPassword').value;
        if (!mail || !password) {
            box.textContent = 'Enter mail and password';
            box.style.display = 'block';
            return;
        }

        const res = await fetch('/api/users/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mail, password })
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
            box.textContent = data.message || 'Invalid credentials';
            box.style.display = 'block';
            return;
        }

        sessionStorage.setItem(AUTH_KEY, JSON.stringify({
            id: data.id,
            name: data.name,
            mail: data.mail,
            role: data.role,
            access_token: data.access_token
        }));

        if (data.role !== 'Admin') {
            box.textContent = 'Logged in as ' + data.role + '. Admin panel is Admin-only for now; keep your token for API clients.';
            box.style.display = 'block';
            return;
        }
        window.location.href = '/index.html';
    });
</script>
</body>
</html>
