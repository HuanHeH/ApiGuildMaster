<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GuildMaster - Login</title>
    <link rel="stylesheet" href="/styles.css?v=20260722d" />
</head>
<body class="login-page">
<div class="login-card">
    <h1>GuildMaster</h1>
    <p class="subtitle">Admin access</p>
    <form id="formLogin">
        <div class="form-group">
            <label for="loginMail">Mail</label>
            <input type="email" id="loginMail" autocomplete="username" required>
        </div>
        <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" autocomplete="current-password" required>
        </div>
        <button type="submit">Login</button>
    </form>
    <div id="loginError" class="auth-error"></div>
</div>
<script>
    const AUTH_KEY = 'gm_admin_auth';
    if (sessionStorage.getItem(AUTH_KEY)) {
        window.location.href = '/index.html';
    }

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
        e.preventDefault();
        const box = document.getElementById('loginError');
        box.style.display = 'none';

        const mail = document.getElementById('loginMail').value.trim();
        const password = document.getElementById('loginPassword').value;
        if (!mail || !password) {
            box.textContent = 'Enter mail and password';
            box.style.display = 'block';
            return;
        }

        const res = await fetch('/api/users/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mail, password })
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
            box.textContent = data.message || 'Invalid credentials or user is not Admin';
            box.style.display = 'block';
            return;
        }

        sessionStorage.setItem(AUTH_KEY, JSON.stringify({
            id: data.id,
            name: data.name,
            mail: data.mail,
            role: data.role
        }));
        window.location.href = '/index.html';
    });
</script>
</body>
</html>
